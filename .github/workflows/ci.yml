name: PrivacyLens checks
on:
  push:
  pull_request:
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: privacylens
          POSTGRES_PASSWORD: ci_test_only
          POSTGRES_DB: privacylens_ci_app
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U privacylens -d privacylens_ci_app"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://privacylens:ci_test_only@localhost:5432/privacylens_ci_app
      TEST_DATABASE_URL: postgresql://privacylens:ci_test_only@localhost:5432/privacylens_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run security:repo
      - run: npm run test:publication
      - run: npm run test:containers
      - run: npm run release:check
      - run: npm audit --audit-level=high
      - run: npm run db:generate
      - run: npm run db:validate
      - name: Create separate disposable CI test database
        run: docker exec ${{ job.services.postgres.id }} psql -U privacylens -d postgres -c 'CREATE DATABASE privacylens_test'
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run db:migrate:test
      - run: npm run db:seed:test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run evaluate:check
      - run: npm run test:integration
      - run: npm run evaluate
      - run: npm run build
      - run: npm run test:smoke
      - run: npm run verify:extension
      - name: Build and verify HTTPS-only release extension without contacting a server
        run: npm run build:extension:production
        env:
          EXTENSION_API_ORIGIN: https://privacy.example.com
      - name: Validate container and reverse-proxy preparation
        shell: bash
        run: |
          set -euo pipefail
          (
            # Compose's service env_file is separate from CLI interpolation.
            # Use only the checked-in placeholders; never replace a host's file.
            umask 077
            if [[ -e deploy/.env.production || -L deploy/.env.production ]]; then
              echo 'Refusing to replace an existing production environment file.' >&2
              exit 1
            fi
            set -o noclobber
            : > deploy/.env.production
            trap 'rm -f deploy/.env.production' EXIT
            cat deploy/.env.production.example >> deploy/.env.production
            docker compose --env-file deploy/.env.production -f deploy/compose.production.yml config --quiet
          )
          # The temporary environment file is already removed before builds.
          docker build -f deploy/Dockerfile --target api -t privacylens-api:ci .
          docker build -f deploy/Dockerfile --target migration -t privacylens-migration:ci .
          docker build -f deploy/Dockerfile --target web -t privacylens-web:ci .
          docker run --rm -e PUBLIC_DOMAIN=privacy.example.com privacylens-web:ci caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Exercise prepared runtime images privately in CI
        timeout-minutes: 5
        run: node scripts/container-smoke.mjs
      - name: Resolve installed Chrome for native workflow verification
        run: |
          command -v google-chrome
          google-chrome --version
          echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - run: npm run test:browser-scanner
      - run: npm run test:browser-sync
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-and-browser-evidence
          retention-days: 7
          path: |
            docs/research/evaluation.json
            docs/research/browser-performance.json
            .browser-smoke/*report.json
            .browser-smoke/*.png
